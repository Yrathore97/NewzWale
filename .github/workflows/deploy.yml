name: NewzWale CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      # astro build spins up a Cloudflare preview server to prerender static
      # pages, which eagerly opens a remote proxy session for any binding
      # marked remote: true (the WEBSEARCH binding has no local emulation).
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
    - uses: actions/checkout@v7

    # Node 24, not 22, specifically so the D1 schema tests RUN rather than skip.
    # tests/db/migration.test.ts executes migration 0001 against node:sqlite,
    # which is unflagged only from Node 23.4 (on 22 it needs
    # --experimental-sqlite). Under Node 22 those 24 tests silently skipped, so
    # a green CI run reported coverage it did not have.
    - name: Set up Node.js 24
      uses: actions/setup-node@v7
      with:
        node-version: 24

    # Fails the run if node:sqlite is unavailable, so the schema tests can
    # never quietly go back to skipping after a future runner change.
    - name: Verify node:sqlite is available (D1 schema tests depend on it)
      run: node -e "require('node:sqlite'); console.log('node:sqlite OK on ' + process.version)"

    - name: Install dependencies
      run: npm ci

    # Dependency vulnerability gate (audit S-16). Deliberately placed BEFORE
    # the build's `if:` guard so it also runs on Dependabot PRs — it needs no
    # secret, and a dependency bump is exactly the change this should block.
    #
    # --audit-level=high fails on high and critical only. Moderate and below
    # are reported without failing: Dependabot already proposes those updates,
    # and a gate that cries wolf on every transitive moderate gets bypassed,
    # which is worse than not having one.
    - name: Audit dependencies
      run: npm audit --audit-level=high

    - name: Run unit tests
      run: npm test

    - name: Astro Code Check & Type Check
      run: npx astro check

    # GitHub withholds repository secrets from Dependabot-triggered runs, so
    # CLOUDFLARE_API_TOKEN is empty there and the remote proxy session the
    # build needs cannot start. Tests and astro check above still run and are
    # what actually catch a breaking dependency; the token stays unreachable
    # from dependency code, which is the point of the restriction.
    - name: Build Web Application
      if: github.actor != 'dependabot[bot]'
      run: npm run build

    # ── Deploy. Closes audit item P-14: this workflow tested and built but
    # never shipped, so every release was a manual `npm run deploy` from
    # someone's laptop.
    #
    # GATED ON push-to-main, DELIBERATELY. A `pull_request` run must never
    # reach this step: PR runs build code that has not been reviewed and, from
    # a fork, code an outsider wrote. Publishing that to the live site would
    # turn "open a PR" into "deploy to production". `github.event_name` is the
    # check that stops it - `github.ref` alone is not enough, because on a
    # pull_request event it can still point at main.
    #
    # `npx wrangler deploy`, not `npm run deploy`: the latter is
    # `npm run build && wrangler deploy`, which would rebuild and ship an
    # artifact the checks above never saw. This ships exactly the dist/ that
    # the tests, type check and build just passed against.
    #
    # CLOUDFLARE_ACCOUNT_ID is an identifier, not a credential - it authorises
    # nothing without the token, and Cloudflare's own docs keep it in the
    # committed wrangler config. It is set explicitly because wrangler only
    # auto-detects an account when the token resolves to exactly one, and a
    # deploy that breaks the day a second account appears is not autopilot.
    - name: Deploy to Cloudflare Workers
      if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'dependabot[bot]'
      env:
        CLOUDFLARE_ACCOUNT_ID: df8800cb8bd7ac035fd1cd46f5dd66ed
      run: npx wrangler deploy
